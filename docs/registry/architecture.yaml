# Last Breath - Architecture Registry
#
# Single source of truth for IDs. Any agent that creates, renames, or
# deletes a system/class/config MUST update this file in the same change.
#
# ID convention:
#   PILLAR-NN             design pillars (GDD)
#   MECH-<NAME>           mechanics (GDD)
#   SCENE-<NAME>          playable scenes (GDD)
#   LAYOUT-<token>-<name> sub-sections of a scene (level design); see ADR-0007
#   ART-<scope>-<name>    3D art assets (asset design); see ADR-0008
#   TAG-<NAME>            gameplay tags declared in TagManager.asset
#   SYS-<NAME>            systems (SDD)
#   CLASS-<Name>          concrete classes (TDD)
#   CFG-<NAME>            configuration ScriptableObjects
#   EVT-<name>            shared events
#   {DOMAIN}-{NAME}       rules in .claude/rules/<domain>.md (e.g., HARNESS-LOOP-*); see ADR-0011
#
# Once created, an ID is never renamed. If something stops existing,
# status: deprecated and the entry stays.

version: 1
project: last-breath-poc
engine: unity
render_pipeline: urp

# ---------------------------------------------------------------------------
# Pinned tooling. Single source of truth; mirrored by
# docs/engine-reference/unity/VERSION.md, docs/engine-reference/blender/VERSION.md,
# docs/engine-reference/mcp/VERSIONS.md, and .mcp.json. Drift is checked by
# scripts/check-runtime-versions.py at SessionStart (advisory).
#
# Rationale: ADR-0009. Bumps are plan-gated. The "no-stale-APIs" rule in
# AGENTS.md requires a Context7 query before any code call into a library
# pinned below.
tooling:
  unity:
    version: 6000.0.32f1            # Unity 6 LTS; Tech Stream is out of scope per ADR-0009
    track: 6-lts
    packages:
      render_pipelines_universal: 17.0.3
      inputsystem: 1.11.2
      cinemachine: 3.1.2
      test_framework: 1.4.5
      ide_rider: 3.0.32
      addressables: 2.3.16          # recommended-but-not-enforced (advisory rule)
      vcontainer: 1.16.9            # DI; LifetimeScope is the only composition root
      unitask: 2.5.10               # preferred async runtime under src/Assets/_Project/**
  blender:
    version: 5.1.0                  # fallback: latest 4.x LTS if 5.1 not yet stable upstream
    track: stable
    fallback_track: 4-lts
    gltf_exporter: bundled-with-blender
  mcp_servers:
    context7:
      source: "@upstash/context7-mcp"
      pin: "1.0.14"
      pin_type: npm
    unity_mcp:
      source: "justinpbarnett/unity-mcp"
      pin: null                     # to be filled at first install by unity-specialist
      pin_type: git_sha
    blender_mcp:
      source: "<upstream>/blender-mcp"
      pin: null                     # to be filled at first install by asset-designer
      pin_type: git_sha
  di_framework: vcontainer
  async_runtime: unitask
  asset_management: addressables_advisory

